<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#286e5e" />
    <title>rootine · {{TITLE}}</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f5f5ee; color: #17332d; padding: max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom)); }
      main { max-width: 720px; margin: 0 auto; }
      .brand { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: lowercase; color: #286e5e; }
      h1 { margin: 18px 0 8px; font-size: clamp(30px, 7vw, 44px); line-height: 1.05; }
      p { line-height: 1.6; }
      .muted { color: #5d6e64; }
      .notice, section { margin-top: 18px; border: 1px solid #cad5cf; border-radius: 18px; background: #fffdf7; padding: 16px; }
      .notice strong { display: block; margin-bottom: 4px; }
      h2 { margin: 0 0 10px; font-size: 17px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid #e2e8e4; }
      li:first-child { border-top: 0; }
      .mark { width: 22px; flex: 0 0 22px; text-align: center; font-weight: 700; color: #286e5e; }
      .meta { margin-top: 20px; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        body { background: #102825; color: #edf4ef; }
        .brand, .mark { color: #8fc9b8; }
        .muted { color: #b7c8c0; }
        .notice, section { background: #17332d; border-color: #38574e; }
        li { border-color: #38574e; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">rootine</div>
      <h1>{{TITLE}}</h1>
      <p class="muted">{{BODY}}</p>
      <div class="notice">
        <strong>{{STATUS_TITLE}}</strong>
        <span>{{STATUS_BODY}}</span>
      </div>
      {{CONTENT}}
      <p class="meta muted">{{SAVED}}</p>
    </main>
  </body>
</html>
